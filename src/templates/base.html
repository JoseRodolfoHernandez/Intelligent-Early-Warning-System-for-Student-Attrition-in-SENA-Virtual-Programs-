<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SENA Analytics Framework{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #1e1e1e !important; border-bottom: 2px solid #39a900; }
        .nav-link { color: #b0b0b0 !important; }
        .nav-link:hover, .nav-link.active { color: #39a900 !important; font-weight: bold; }
        .card { background-color: #1e1e1e; border: 1px solid #2d2d2d; color: #e0e0e0; margin-bottom: 20px; }
        .text-sena { color: #39a900; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-sena" href="#">🎓 SENA CRISP-ML</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/business-understanding">Business Understanding</a></li>
                    <li class="nav-item"><a class="nav-link" href="/data-understanding">Data Understanding</a></li>
                    <li class="nav-item"><a class="nav-link" href="/data-engineering">Data Engineering</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
