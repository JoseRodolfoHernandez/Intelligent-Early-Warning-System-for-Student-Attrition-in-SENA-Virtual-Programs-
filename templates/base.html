<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENA Attrition - CRISP-ML Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f111a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar { background-color: #161925 !important; border-bottom: 3px solid #39a900; }
        .nav-link { color: #94a3b8 !important; font-size: 0.95rem; margin: 0 5px; }
        .nav-link:hover { color: #39a900 !important; }
        .card { background-color: #161925; border: 1px solid #23293e; color: #e2e8f0; border-radius: 8px; }
        .text-sena { color: #39a900; font-weight: bold; }
        h3 { color: #39a900; font-size: 1.3rem; margin-bottom: 15px; border-bottom: 1px solid #23293e; padding-bottom: 8px; }
        .badge-tech { background-color: #23293e; color: #00ffcc; font-family: monospace; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-xl navbar-dark sticky-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-sena" href="/">🎓 SENA EWS-Elearning</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/business-understanding">Business Understanding</a></li>
                    <li class="nav-item"><a class="nav-link" href="/data-understanding">Data Understanding</a></li>
                    <li class="nav-item"><a class="nav-link" href="/data-engineering">Data Engineering</a></li>
                    <li class="nav-item"><a class="nav-link" href="/model-engineering">Model Engineering</a></li>
                    <li class="nav-item"><a class="nav-link" href="/model-evaluation">Model Evaluation</a></li>
                    <li class="nav-item"><a class="nav-link" href="/prediction-system">Prediction System</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
